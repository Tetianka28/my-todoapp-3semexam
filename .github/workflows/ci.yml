name: CI
#runs on every pull request into develop or main and on every push to develop
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]



#GitHub starts a fresh Linux machine, which already has Chrome installed
jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: todo-app #Vite project is in the subfolder, so every run step executes there

    steps:
      - name: Get the code
        uses: actions/checkout@v4 #downloads my repo onto that machine

      - name: Set up Node.js 
        uses: actions/setup-node@v4 #installs Node 20 and caches npm downloads to speed up later runs
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - name: Install dependencies
        run: npm ci #clean install from package-lock.json (stricter and faster than npm install)

#unit tests, then build, then end-to-end tests. If one fails, the pipeline stops and shows a red X
      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: End-to-end tests (TestCafé)
        run: npm run test:e2e